[project]
name = "cloud-helper-fastmcp"
version = "0.1.0"
description = "FastMCP RS-mode server for MCP OAuth repro/fix"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0",
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
cloud-helper-fastmcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py"]

[tool.uv]
package = true
