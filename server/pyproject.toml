[project]
name = "cloud-helper-fastmcp"
version = "0.1.0"
description = "FastMCP RS-mode server for MCP OAuth repro/fix"
requires-python = ">=3.12"
dependencies = [
    # fastmcp wraps the official mcp SDK and adds OAuthProxy, JWTVerifier,
    # and a full OAuth 2.1 proxy server — all we need in one package.
    "fastmcp>=3.2",
    "pydantic-settings>=2.0",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
cloud-helper-fastmcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py"]

[tool.uv]
package = true
